name: Update VPN config

on:
  push:
    branches: [main]
  schedule:
    # Daily at 07:00 Asia/Shanghai (23:00 UTC).
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: airport3-config-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh public subscription lists
        run: python3 .github/scripts/update_configs.py

      - name: Validate generated lists and page links
        run: python3 .github/scripts/verify_configs.py

      - name: Commit changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: refresh VPN configs ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:main
          fi
